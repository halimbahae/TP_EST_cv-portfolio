<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahae Eddine HALIM | Data Architect</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Noto+Sans+Arabic:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --text-dark: #f0f0f0;
            --accent: #00f2ff;
            --bg-light: #f5f5f7;
            --text-light: #1d1d1f;
        }

        body {
            margin: 0;
            overflow-x: hidden;
            font-family: 'Space+Grotesk', 'Noto+Sans+Arabic', sans-serif;
            transition: background 0.5s ease, color 0.5s ease;
        }

        body.dark-mode {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }

        body.light-mode {
            background-color: var(--bg-light);
            color: var(--text-light);
        }

        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            pointer-events: none;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        .light-mode .glass {
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .custom-cursor {
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s ease;
            mix-blend-mode: difference;
        }

        .section-visible {
            opacity: 1;
            transform: translateY(0);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .section-hidden {
            opacity: 0;
            transform: translateY(50px);
        }

        .lang-btn.active {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 15px var(--accent);
        }

        [dir="rtl"] {
            font-family: 'Noto+Sans+Arabic', sans-serif;
        }

        .card-hover:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(0, 242, 255, 0.1);
        }

        /* Gamified Progress Bar */
        #progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            z-index: 1000;
        }
        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #7000ff);
            width: 0%;
        }

        .orbit-label {
            position: absolute;
            pointer-events: none;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 2px;
            opacity: 0.5;
        }
    </style>
</head>
<body class="dark-mode">

    <div id="progress-container"><div id="progress-bar"></div></div>
    <div class="custom-cursor" id="cursor"></div>
    <canvas id="three-canvas"></canvas>

    <!-- Navigation & Controls -->
    <nav class="fixed top-6 left-1/2 -translate-x-1/2 z-50 flex items-center gap-4 px-6 py-3 glass rounded-full">
        <div class="flex gap-2 mr-4 border-r border-white/20 pr-4" id="lang-switcher">
            <button onclick="setLanguage('en')" class="lang-btn px-3 py-1 rounded-full text-xs transition-all active" id="btn-en">EN</button>
            <button onclick="setLanguage('fr')" class="lang-btn px-3 py-1 rounded-full text-xs transition-all" id="btn-fr">FR</button>
            <button onclick="setLanguage('ar')" class="lang-btn px-3 py-1 rounded-full text-xs transition-all" id="btn-ar">AR</button>
        </div>
        <button id="theme-toggle" class="p-2 rounded-full hover:bg-white/10 transition-colors">
            <svg id="moon-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            <svg id="sun-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 18v1m9-9h-1M4 9h-1m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        </button>
    </nav>

    <!-- Main Content -->
    <main class="relative z-10 container mx-auto px-6 pt-32 pb-20">
        
        <!-- Hero -->
        <section id="hero" class="min-height-[80vh] flex flex-col items-center justify-center text-center mb-32 section-hidden">
            <h2 id="hero-tag" class="text-accent uppercase tracking-[0.5em] text-sm mb-4 font-bold"></h2>
            <h1 id="hero-name" class="text-6xl md:text-8xl font-bold mb-6 bg-clip-text text-transparent bg-gradient-to-b from-white to-gray-500"></h1>
            <p id="hero-title" class="text-xl md:text-2xl opacity-70 max-w-2xl mx-auto leading-relaxed"></p>
        </section>

        <!-- Experience Grid -->
        <section class="mb-32">
            <h3 id="section-exp" class="text-3xl font-bold mb-12 border-b border-accent/30 pb-4 inline-block"></h3>
            <div id="exp-container" class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Injected via JS -->
            </div>
        </section>

        <!-- Skills Cloud / Gamified Stats -->
        <section class="mb-32 section-hidden">
            <h3 id="section-skills" class="text-3xl font-bold mb-12 border-b border-accent/30 pb-4 inline-block"></h3>
            <div id="skills-container" class="grid grid-cols-2 md:grid-cols-4 gap-6">
                <!-- Injected via JS -->
            </div>
        </section>

        <!-- Footer / Contact -->
        <footer class="glass p-12 text-center rounded-[40px] section-hidden">
            <h2 id="footer-cta" class="text-4xl font-bold mb-8"></h2>
            <div class="flex flex-wrap justify-center gap-6">
                <a href="mailto:contact@xai.ma" class="px-8 py-4 bg-accent text-black font-bold rounded-full hover:scale-105 transition-transform">Email Me</a>
                <a href="https://linkedin.com/in/bahae-eddine-halim" target="_blank" class="px-8 py-4 border border-white/20 rounded-full hover:bg-white/5 transition-colors">LinkedIn</a>
            </div>
        </footer>
    </main>

    <script>
        // --- DATA OBJECT ---
        const cvData = {
            en: {
                tag: "Data Translation Architect",
                name: "Bahae Eddine HALIM",
                title: "Bridging the gap between Advanced AI research and business implementation. Founder of Morocco Data Science & CTO of XAI.ma.",
                sections: {
                    exp: "Mission History",
                    skills: "Technical Arsenal",
                    footer: "Ready to hack the future?"
                },
                experience: [
                    { role: "Co-founder & CTO", company: "XAI.ma", date: "2025 - Present", desc: "Leading technical roadmap for AI-driven automation. Architecting scalable data infrastructures." },
                    { role: "Technical Trainer", company: "PhD Program - Rabat", date: "2026 - Present", desc: "Delivering intensive AI/Data Science programs for advanced researchers." },
                    { role: "Founder", company: "Morocco Data Science", date: "2024 - Present", desc: "Building the premier community for Data Scientists. Orchestrated XAI Hackathon." }
                ],
                skills: ["Python", "Solidity (Web3)", "Data Science", "Marketing Analytics", "Smart Contracts", "Tech Leadership", "Docker", "Power BI"]
            },
            fr: {
                tag: "Architecte de Traduction de Données",
                name: "Bahae Eddine HALIM",
                title: "Combler le fossé entre la recherche IA avancée et l'implémentation business. Fondateur de Morocco Data Science & CTO de XAI.ma.",
                sections: {
                    exp: "Historique des Missions",
                    skills: "Arsenal Technique",
                    footer: "Prêt à hacker le futur ?"
                },
                experience: [
                    { role: "Co-fondateur & CTO", company: "XAI.ma", date: "2025 - Présent", desc: "Direction de la roadmap technique pour l'automatisation par l'IA." },
                    { role: "Formateur Technique", company: "Programme PhD - Rabat", date: "2026 - Présent", desc: "Programmes intensifs en IA/Data Science pour doctorants." },
                    { role: "Fondateur", company: "Morocco Data Science", date: "2024 - Présent", desc: "Création de la plus grande communauté Data Science au Maroc." }
                ],
                skills: ["Python", "Solidity (Web3)", "Data Science", "Marketing Analytics", "Smart Contracts", "Leadership Tech", "Docker", "Power BI"]
            },
            ar: {
                tag: "مهندس ترجمة البيانات",
                name: "بهاء الدين حليم",
                title: "جسر الهوة بين أبحاث الذكاء الاصطناعي المتقدمة والتطبيق العملي في الأعمال. مؤسس مجتمع Morocco Data Science والمدير التقني لشركة XAI.ma.",
                sections: {
                    exp: "سجل المهام",
                    skills: "الترسانة التقنية",
                    footer: "هل أنت مستعد لبناء المستقبل؟"
                },
                experience: [
                    { role: "مؤسس مشارك ومدير تقني", company: "XAI.ma", date: "2025 - الآن", desc: "قيادة الخارطة التقنية لحلول الأتمتة المعتمدة على الذكاء الاصطناعي." },
                    { role: "مدرب تقني", company: "برنامج الدكتوراه - الرباط", date: "2026 - الآن", desc: "تقديم برامج تدريبية مكثفة في علوم البيانات لطلاب الدكتوراه." },
                    { role: "مؤسس", company: "Morocco Data Science", date: "2024 - الآن", desc: "بناء أول مجتمع لعلماء البيانات في المغرب وتنظيم هاكاثون XAI." }
                ],
                skills: ["بايثون", "سوليديتي (Web3)", "علوم البيانات", "تحليلات التسويق", "العقود الذكية", "القيادة التقنية", "دوكر", "باور بي آي"]
            }
        };

        // --- STATE MANAGEMENT ---
        let currentLang = 'en';
        let isDarkMode = true;

        function setLanguage(lang) {
            currentLang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            
            // Update active button
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${lang}`).classList.add('active');

            // Render Content
            const data = cvData[lang];
            document.getElementById('hero-tag').textContent = data.tag;
            document.getElementById('hero-name').textContent = data.name;
            document.getElementById('hero-title').textContent = data.title;
            document.getElementById('section-exp').textContent = data.sections.exp;
            document.getElementById('section-skills').textContent = data.sections.skills;
            document.getElementById('footer-cta').textContent = data.sections.footer;

            // Render Experience
            const expCont = document.getElementById('exp-container');
            expCont.innerHTML = data.experience.map((e, i) => `
                <div class="glass p-8 card-hover transition-all duration-500 section-hidden" style="transition-delay: ${i * 100}ms">
                    <span class="text-accent text-sm font-bold">${e.date}</span>
                    <h4 class="text-2xl font-bold mt-2">${e.role}</h4>
                    <p class="text-white/50 mb-4">${e.company}</p>
                    <p class="opacity-80">${e.desc}</p>
                </div>
            `).join('');

            // Render Skills
            const skillCont = document.getElementById('skills-container');
            skillCont.innerHTML = data.skills.map((s, i) => `
                <div class="glass px-4 py-3 text-center rounded-xl hover:bg-accent hover:text-black transition-all cursor-default font-bold">
                    ${s}
                </div>
            `).join('');

            refreshScrollObserver();
        }

        // --- THREE.JS SCENE ---
        let scene, camera, renderer, particles, torus;
        
        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // Create Data Particles
            const particlesGeometry = new THREE.BufferGeometry();
            const count = 1500;
            const positions = new Float32Array(count * 3);
            for(let i=0; i<count*3; i++) {
                positions[i] = (Math.random() - 0.5) * 15;
            }
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const particlesMaterial = new THREE.PointsMaterial({
                size: 0.02,
                color: 0x00f2ff,
                transparent: true,
                opacity: 0.6
            });
            particles = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particles);

            // Central "Data Translation" Core
            const torusGeo = new THREE.TorusKnotGeometry(1.5, 0.4, 100, 16);
            const torusMat = new THREE.MeshPhongMaterial({ 
                color: 0x00f2ff, 
                wireframe: true,
                transparent: true,
                opacity: 0.2
            });
            torus = new THREE.Mesh(torusGeo, torusMat);
            scene.add(torus);

            const light = new THREE.PointLight(0x00f2ff, 1, 100);
            light.position.set(5, 5, 5);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.2));

            camera.position.z = 5;
        }

        function animate() {
            requestAnimationFrame(animate);
            particles.rotation.y += 0.001;
            torus.rotation.x += 0.005;
            torus.rotation.y += 0.002;
            
            // Pulse effect
            const time = Date.now() * 0.001;
            torus.scale.setScalar(1 + Math.sin(time) * 0.1);
            
            renderer.render(scene, camera);
        }

        // --- UTILS & UX ---
        function handleScroll() {
            const scrollPercent = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
            document.getElementById('progress-bar').style.width = scrollPercent + '%';

            // React Three.js to scroll
            if(torus) {
                torus.position.y = -window.scrollY * 0.002;
                camera.position.z = 5 + window.scrollY * 0.001;
            }
        }

        function refreshScrollObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.remove('section-hidden');
                        entry.target.classList.add('section-visible');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('section, .glass, footer').forEach(el => observer.observe(el));
        }

        // Theme Toggle
        document.getElementById('theme-toggle').addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-mode');
            document.body.classList.toggle('light-mode');
            document.getElementById('moon-icon').classList.toggle('hidden');
            document.getElementById('sun-icon').classList.toggle('hidden');
            
            // Update ThreeJS color
            const color = isDarkMode ? 0x00f2ff : 0x7000ff;
            particles.material.color.setHex(color);
            torus.material.color.setHex(color);
        });

        // Custom Cursor
        document.addEventListener('mousemove', (e) => {
            const cursor = document.getElementById('cursor');
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            
            // 3D parallax
            if(scene) {
                const mouseX = (e.clientX / window.innerWidth) - 0.5;
                const mouseY = (e.clientY / window.innerHeight) - 0.5;
                scene.rotation.y = mouseX * 0.2;
                scene.rotation.x = mouseY * 0.2;
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize
        window.onload = () => {
            initThree();
            animate();
            setLanguage('en');
            window.addEventListener('scroll', handleScroll);
        };
    </script>
</body>
</html>
